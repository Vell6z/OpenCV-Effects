<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop Vertical</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            /* Evita que aparezcan barras de scroll */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        video {
            width: 100%;
            height: 100%;
            /* cover asegura que el video llene toda la pantalla recortando los bordes si es necesario, 
               contain mostraría el video completo pero dejaría bandas negras a los lados */
            object-fit: cover;
        }
    </style>
</head>

<body>

    <!-- playsinline es crucial para que en iOS el video no se abra en el reproductor nativo de Apple -->
    <video src="PolaryzProject.mp4" autoplay loop muted playsinline></video>

</body>

</html>
